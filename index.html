<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Unlocker</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #111827;
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .progress-bar-container {
      width: 100%;
      height: 24px;
      background-color: #1f2937;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #0284c7;
      transition: width 0.3s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 24px;
      padding: 0 2px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:active {
      opacity: 0.85;
    }

    .btn-share {
      background-color: #0ea5e9;
      color: #ffffff;
    }

    .btn-unlock {
      background-color: #1f2937;
      color: #6b7280;
      cursor: not-allowed;
    }

    .btn-unlock.active {
      background-color: #eab308;
      color: #000000;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>HIDDEN CAM IS LOCKED</h2>

    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="progress-info">
      <span id="progress-percent">0% Completed</span>
      <span id="task-count">0 / 5 Tasks</span>
    </div>

    <button class="btn btn-share" onclick="handleTask()">SHARE</button>
    <button id="unlock-btn" class="btn btn-unlock" disabled onclick="unlockContent()">UNLOCK VIDEOS (0/5)</button>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // App State
    let completedTasks = 0;
    const totalTasks = 5;
    const ADSGRAM_BLOCK_ID = "40172";
    const JOIN_GROUP_URL = "https://t.me/+IReYrDe7TbowZGNl";

    // Handle Action
    function handleTask() {
      if (completedTasks >= totalTasks) return;

      // Try Adsgram ad display
      if (typeof window.Adsgram !== "undefined") {
        try {
          const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

          AdController.show()
            .then((result) => {
              completedTasks++;
              updateUI();
            })
            .catch((error) => {
              console.error("Adsgram Error:", error);
              // Fallback to group join link if ad fails to load
              openGroupLink();
            });
        } catch (err) {
          openGroupLink();
        }
      } else {
        openGroupLink();
      }
    }

    // Open Telegram Group Link & Increment Task
    function openGroupLink() {
      if (tg) {
        tg.openTelegramLink(JOIN_GROUP_URL);
      } else {
        window.open(JOIN_GROUP_URL, "_blank");
      }
      completedTasks++;
      updateUI();
    }

    // Update Progress Bar & UI
    function updateUI() {
      if (completedTasks > totalTasks) completedTasks = totalTasks;

      const percent = Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-percent').innerText = `${percent}% Completed`;
      document.getElementById('task-count').innerText = `${completedTasks} / ${totalTasks} Tasks`;
      document.getElementById('progress-fill').style.width = `${percent}%`;

      const unlockBtn = document.getElementById('unlock-btn');
      unlockBtn.innerText = `UNLOCK VIDEOS (${completedTasks}/${totalTasks})`;

      if (completedTasks >= totalTasks) {
        unlockBtn.classList.add('active');
        unlockBtn.disabled = false;
      }
    }

    // Final Unlock
    function unlockContent() {
      if (completedTasks >= totalTasks) {
        alert("🎉 Unlocked!");
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telegram Mini App - Adsgram Integration</title>

  <!-- Open Graph Meta Tags for GitHub & Social Sharing previews -->
  <meta property="og:title" content="Telegram Mini App" />
  <meta property="og:description" content="Adsgram integration block ID 40172" />
  <meta property="og:type" content="website" />

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background-color: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 0.9rem;
      min-height: 20px;
    }

    .success {
      color: #22c55e;
    }

    .error {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Watch Ad & Earn</h2>
    <p>Watch a short video ad to collect your reward.</p>
    
    <button id="adBtn" class="btn" onclick="triggerAd()">Watch Ad</button>
    
    <div id="status" class="status-msg"></div>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Initialize Adsgram with Block ID 40172
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "40172" }) : null;

    function triggerAd() {
      const btn = document.getElementById('adBtn');
      const status = document.getElementById('status');

      if (!AdController) {
        status.className = 'status-msg error';
        status.innerText = 'Adsgram SDK failed to load.';
        return;
      }

      btn.disabled = true;
      status.className = 'status-msg';
      status.innerText = 'Loading ad...';

      AdController.show().then((result) => {
        // User completed watching the ad
        status.className = 'status-msg success';
        status.innerText = '✅ Reward granted!';
        console.log('Ad completed:', result);
      }).catch((error) => {
        // Ad skipped or error occurred
        status.className = 'status-msg error';
        if (error && error.error) {
          status.innerText = '⚠️ Ad closed early or failed to load.';
        } else {
          status.innerText = '⚠️ No ads available currently.';
        }
        console.error('Ad Error:', error);
      }).finally(() => {
        btn.disabled = false;
      });
    }
  </script>

</body>
</html>

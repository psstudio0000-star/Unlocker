<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HD Premium Video Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script id="adsgram-script" src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #090d16; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #121824; border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; text-align: center; border: 1px solid #1e293b; }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 15px; background: #2563eb; color: #fff; }
    .status-box { margin-top: 15px; font-size: 13px; color: #94a3b8; background: #0b0f17; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; }
  </style>
</head>
<body>

  <div class="card">
    <h2>HD VIDEO UNLOCK</h2>
    <div id="status" class="status-box">Status: Ready to Test</div>
    <button id="unlock-btn" class="btn" onclick="triggerAd()">⚡ TEST AD LOAD</button>
  </div>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // 👇 New Block ID set
    const ADSGRAM_BLOCK_ID = "42965";

    function triggerAd() {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "Status: Initializing Adsgram...";

      if (typeof window.Adsgram === "undefined") {
        alert("Adsgram SDK load nahi hua! Internet/Script Block check karein.");
        statusEl.innerText = "Status: SDK Script Failed";
        return;
      }

      try {
        const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID, debug: true });
        
        statusEl.innerText = "Status: Requesting Ad from Server...";
        
        AdController.show()
          .then((result) => {
            alert("Success! Ad Played Completely.");
            statusEl.innerText = "Status: Ad Completed Successfully!";
          })
          .catch((error) => {
            console.log("Adsgram Catch Error:", error);
            alert("Adsgram Server Response: " + JSON.stringify(error));
            statusEl.innerText = "Status: Error - " + (error.description || error.error || "No Ads");
          });
      } catch (e) {
        alert("Exception: " + e.message);
      }
    }
  </script>
</body>
</html>

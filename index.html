<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Mini App</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Adsgram SDK -->
  <script src="https://adsgram.ai/js/adsgram-adbox.js"></script>

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --text-color: var(--tg-theme-text-color, #f8fafc);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --btn-bg: var(--tg-theme-button-color, #3b82f6);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Ad Trigger Section */
    .ad-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .ad-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 600;
      color: var(--btn-text);
      background-color: var(--btn-bg);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .ad-btn:active {
      opacity: 0.8;
    }

    /* Main Content Area */
    .content-area {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ADSGRAM AD SECTION -->
    <div class="ad-card">
      <h3>Watch Ad</h3>
      <p style="font-size: 14px; opacity: 0.8; margin-top: 4px;">Click below to load and view the advertisement.</p>
      <button class="ad-btn" id="showAdBtn">Show Ad</button>
    </div>

    <!-- ======================================================= -->
    <!-- PASTE YOUR CONTENT HERE (Movies, links, text, etc.)     -->
    <!-- ======================================================= -->
    <div class="content-area">
      <h2>Welcome to App</h2>
      <p style="margin-top: 8px;">Paste your content, links, or media here.</p>
    </div>
    <!-- ======================================================= -->

  </div>

  <script>
    // 1. Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 2. Initialize Adsgram with Block ID 40102
    const AdController = window.Adsgram?.init({
      blockId: "40102"
    });

    // 3. Attach click handler to trigger the ad
    const showAdBtn = document.getElementById("showAdBtn");

    showAdBtn.addEventListener("click", async () => {
      if (!AdController) {
        alert("Adsgram SDK is still loading or failed to initialize.");
        return;
      }

      try {
        // Show rewarded ad block
        const result = await AdController.show();
        console.log("Ad completed:", result);
        
        // Action after user successfully watches the ad
        alert("Ad completed successfully!");

      } catch (error) {
        // Triggered if the ad was closed early, failed to load, or skipped
        console.error("Ad incomplete or error:", error);
        alert("Ad was closed or could not be displayed.");
      }
    });
  </script>

</body>
</html>

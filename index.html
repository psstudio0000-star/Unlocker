<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Task Unlocker</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      max-width: 400px;
      width: 100%;
      text-align: center;
      background: #1e293b;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .badge {
      display: inline-block;
      background: #334155;
      color: #38ef7d;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-ad {
      width: 100%;
      padding: 14px 20px;
      background-color: #22c55e;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-ad:active {
      transform: scale(0.98);
    }

    #ad-status {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Content Unlocker</h1>
    <div id="param-badge" class="badge">Code: Default</div>
    <p>Complete the task by watching an ad to unlock your link.</p>
    
    <button class="btn-ad" onclick="triggerAd()">Watch Ad to Unlock</button>

    <div id="ad-status"></div>
  </div>

  <script>
    // Latest Adsgram Block ID
    const BLOCK_ID = "40172"; 
    let AdController;
    let startParam = "None";

    // Initialize Telegram WebApp & read start parameter (e.g. AAA2)
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();

      // Extract parameter passed via startapp (e.g., ?startapp=AAA2)
      const tgParam = window.Telegram.WebApp.initDataUnsafe?.start_param;
      if (tgParam) {
        startParam = tgParam;
      }
    }

    // Display the parameter on UI
    document.getElementById("param-badge").innerText = `Task ID: ${startParam}`;

    function initAdsgram() {
      if (window.Adsgram) {
        AdController = window.Adsgram.init({ blockId: BLOCK_ID });
      }
    }

    function triggerAd() {
      const statusElement = document.getElementById("ad-status");

      if (!AdController) initAdsgram();

      if (!AdController) {
        statusElement.innerText = "Error: Adsgram SDK failed to initialize.";
        statusElement.style.color = "#ef4444";
        return;
      }

      statusElement.innerText = "Loading ad...";
      statusElement.style.color = "#cbd5e1";

      AdController.show()
        .then((result) => {
          console.log("Adsgram Success:", result);
          statusElement.innerText = `Success! Task (${startParam}) verified.`;
          statusElement.style.color = "#22c55e";
        })
        .catch((error) => {
          console.error("Adsgram Error:", error);
          statusElement.innerText = "Ad was skipped or failed to load. Try again!";
          statusElement.style.color = "#ef4444";
        });
    }

    window.addEventListener("DOMContentLoaded", initAdsgram);
  </script>
</body>
</html>
